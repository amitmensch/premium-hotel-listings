<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Luxury Obsidian Gradient -->
    <radialGradient id="psBg" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#232019" />
      <stop offset="55%" stop-color="#15140F" />
      <stop offset="100%" stop-color="#0D0C09" />
    </radialGradient>

    <!-- Warm Polished Champagne-Gold Gradient -->
    <linearGradient id="psGold" x1="12%" y1="12%" x2="88%" y2="88%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="16%" stop-color="#EADBBE" />
      <stop offset="44%" stop-color="#C2A572" />
      <stop offset="72%" stop-color="#B69A6B" />
      <stop offset="100%" stop-color="#7D5E34" />
    </linearGradient>

    <!-- Architectural Stroke Gradient -->
    <linearGradient id="psArch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#EADBBE" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#B69A6B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7D5E34" stop-opacity="0.25" />
    </linearGradient>

    <!-- Border Rim Stroke -->
    <linearGradient id="psRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#C2A572" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#87683E" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#53402A" stop-opacity="0.35" />
    </linearGradient>

    <!-- Diamond Center Highlight -->
    <radialGradient id="psDiamondCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFFDF7" />
      <stop offset="80%" stop-color="#EADBBE" />
      <stop offset="100%" stop-color="#C2A572" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" ry="112" fill="url(#psBg)" />
  <rect x="20" y="20" width="472" height="472" rx="112" ry="112" fill="none" stroke="url(#psRim)" stroke-width="5" />

  <!-- Classical Architectural Archway Portal -->
  <!-- Outer Arch Columns & Semi-Circle -->
  <path d="M 118 416 L 118 238 C 118 161.8 179.8 100 256 100 C 332.2 100 394 161.8 394 238 L 394 416"
        fill="none" stroke="url(#psArch)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Inner Concentric Arch Accent -->
  <path d="M 134 416 L 134 242 C 134 174.6 188.6 120 256 120 C 323.4 120 378 174.6 378 242 L 378 416"
        fill="none" stroke="url(#psArch)" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round" />

  <!-- Arch Steps / Plinth Base -->
  <line x1="96" y1="416" x2="416" y2="416" stroke="url(#psArch)" stroke-width="4" stroke-linecap="round" />
  <line x1="112" y1="426" x2="400" y2="426" stroke="url(#psArch)" stroke-width="2.5" stroke-opacity="0.5" stroke-linecap="round" />

  <!-- Apex Keystone: 5-Star Celestial Diamond (✦) -->
  <g>
    <path d="M 256 32 Q 256 66 290 66 Q 256 66 256 100 Q 256 66 222 66 Q 256 66 256 32 Z"
          fill="url(#psDiamondCore)" />
    <!-- Secondary Diamond Sparks -->
    <path d="M 172 66 Q 172 72 178 72 Q 172 72 172 78 Q 172 72 166 72 Q 172 72 172 66 Z"
          fill="#FFFDF7" opacity="0.8" />
    <path d="M 340 66 Q 340 72 346 72 Q 340 72 340 78 Q 340 72 334 72 Q 340 72 340 66 Z"
          fill="#FFFDF7" opacity="0.8" />
  </g>

  <!-- Perfectly Centered Cormorant Garamond Monogram "P" -->
  <g fill="url(#psGold)">
    <!-- Vertical Column & Serifs -->
    <path d="
      M 144 172
      L 242 172
      L 242 188
      C 242 188, 226 190, 218 198
      C 210 205, 210 215, 210 228
      L 210 348
      C 210 361, 210 371, 218 378
      C 226 386, 242 388, 242 388
      L 242 404
      L 144 404
      L 144 388
      C 144 388, 160 386, 168 378
      C 176 371, 176 361, 176 348
      L 176 228
      C 176 215, 176 205, 168 198
      C 160 190, 144 188, 144 188
      Z
    " />

    <!-- Pure Garamond Sculpted Loop/Bowl of the 'P' -->
    <path fill-rule="evenodd" d="
      M 210 172
      L 290 172
      C 344 172, 368 196, 368 242
      C 368 288, 336 312, 284 312
      L 210 312
      L 210 294
      L 278 294
      C 316 294, 336 276, 336 242
      C 336 208, 316 190, 278 190
      L 210 190
      Z
    " />
  </g>
</svg>